<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriSmart AI - Advanced Farmer Dashboard</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #2d6a4f;
            --secondary: #52b788;
            --accent: #ffb703;
            --glass: rgba(255, 255, 255, 0.9);
            --dark: #1b4332;
        }

        * { box-sizing: border-box; font-family: 'Outfit', sans-serif; }

        body {
            margin: 0;
            background: linear-gradient(135deg, #d8f3dc 0%, #b7e4c7 100%);
            background-attachment: fixed;
            color: var(--dark);
            min-height: 100vh;
        }

        /* Modern Glass Navbar */
        nav {
            background: var(--primary);
            color: white;
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { font-size: 1.5rem; font-weight: 700; letter-spacing: 1px; }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }

        /* Hero/Weather Section */
        .hero-weather {
            background: linear-gradient(to right, #2d6a4f, #1b4332);
            color: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 20px rgba(27, 67, 50, 0.2);
        }

        /* Glassmorphism Cards */
        .card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 24px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease;
        }

        h2 { color: var(--primary); margin-top: 0; font-size: 1.3rem; border-bottom: 2px solid #e9ecef; padding-bottom: 10px; }

        .form-group { margin: 15px 0; }

        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; }

        select, input[type="file"] {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 2px solid #dee2e6;
            background: white;
            font-size: 1rem;
        }

        /* Modern Button Styles */
        .btn-action {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            width: 100%;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .btn-action:hover { background: var(--dark); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }

        /* Output Formatting */
        .result-box {
            margin-top: 20px;
            padding: 18px;
            background: #f8f9fa;
            border-radius: 16px;
            border-left: 6px solid var(--secondary);
            font-size: 0.95rem;
            line-height: 1.7;
            white-space: pre-wrap;
            color: #344e41;
        }

        .lang-split {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 10px;
        }

        @media (max-width: 600px) {
            .hero-weather { flex-direction: column; text-align: center; gap: 15px; }
            .lang-split { grid-template-columns: 1fr; }
        }

        /* Loading Animation */
        .loader {
            display: none;
            text-align: center;
            padding: 10px;
            color: var(--primary);
            font-weight: 600;
        }
    </style>
</head>
<body>

<nav>
    <div class="logo"><i class="fas fa-leaf"></i> AGRISMART AI</div>
    <div id="liveDate" style="font-size: 0.8rem; opacity: 0.9;"></div>
</nav>

<div class="container">
    <div class="hero-weather">
        <div>
            <h4 style="margin:0; opacity: 0.8;">Live Climate</h4>
            <div id="tempVal" style="font-size: 2.2rem; font-weight: 700;">--°C</div>
            <div id="weatherDesc" style="text-transform: capitalize;">Detecting...</div>
        </div>
        <i class="fas fa-cloud-sun-rain" style="font-size: 3.5rem; opacity: 0.3;"></i>
    </div>

    <div class="card">
        <h2><i class="fas fa-seedling"></i> Seasonal Crop Finder</h2>
        <div class="form-group">
            <label>Select Your Region / क्षेत्र चुनें</label>
            <select id="regionSelect">
                <option value="Patna, Bihar">Patna, Bihar</option>
                <option value="Gaya, Bihar">Gaya, Bihar</option>
                <option value="Punjab">Punjab</option>
                <option value="Maharashtra">Maharashtra</option>
            </select>
        </div>
        <button class="btn-action" onclick="fetchCropAdvice()">
            <i class="fas fa-wand-magic-sparkles"></i> Get AI Plan / योजना प्राप्त करें
        </button>
        <div id="cropLoader" class="loader"><i class="fas fa-spinner fa-spin"></i> Consulting AI...</div>
        <div id="cropResult" class="result-box">Dual-language advice will appear here...</div>
    </div>

    <div class="card">
        <h2><i class="fas fa-camera-retro"></i> Disease & Pest Analysis</h2>
        <p style="font-size: 0.85rem; color: #666;">Upload crop leaf photo for AI diagnosis (Bilingual)</p>
        <input type="file" id="imageInput" accept="image/*">
        <button class="btn-action" style="background: var(--dark);" onclick="analyzePlant()">
            <i class="fas fa-microscope"></i> Scan Health / स्वास्थ्य जांचें
        </button>
        <div id="scanLoader" class="loader"><i class="fas fa-spinner fa-spin"></i> Analyzing pixels...</div>
        <div id="scanResult" class="result-box">Results in English & Hindi will appear here...</div>
    </div>
</div>

<script>
    // --- API KEYS ---
    const GEMINI_KEY = "AIzaSyCqvDqec71CBydiY9IcITzAAblPTWO1QBo"; 
    const WEATHER_KEY = "965331e97a71593394ffea811e73b26b";

    // Setup Date
    document.getElementById('liveDate').innerText = new Date().toDateString();

    // 1. Weather Fetch
    async function initWeather() {
        try {
            const res = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=Patna&appid=${WEATHER_KEY}&units=metric`);
            const data = await res.json();
            document.getElementById('tempVal').innerText = `${Math.round(data.main.temp)}°C`;
            document.getElementById('weatherDesc').innerText = data.weather[0].description;
        } catch (e) { console.log("Weather Key Required"); }
    }

    // 2. Gemini Direct API Caller
    async function askGemini(prompt, base64Image = null) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${GEMINI_KEY}`;
        const contents = [{ parts: [{ text: prompt }] }];
        if (base64Image) {
            contents[0].parts.push({ inline_data: { mime_type: "image/jpeg", data: base64Image } });
        }
        const response = await fetch(url, { method: "POST", body: JSON.stringify({ contents }) });
        const data = await response.json();
        return data.candidates[0].content.parts[0].text;
    }

    // 3. Action: Crop Advice
    async function fetchCropAdvice() {
        const region = document.getElementById('regionSelect').value;
        const out = document.getElementById('cropResult');
        const loader = document.getElementById('cropLoader');
        
        loader.style.display = "block";
        out.innerText = "";

        const prompt = `Today is ${new Date().toLocaleDateString()}. For ${region}, provide a seasonal crop guide.
                        Identify 3 crops for this current month. For each crop:
                        1. Provide Name and Soil requirements.
                        2. Provide Water and Fertilizer tips.
                        STRICT RULE: Write the complete analysis first in English, then repeat the same complete analysis in Hindi. Use clear bullet points.`;

        try {
            const result = await askGemini(prompt);
            out.innerText = result;
        } catch (e) { out.innerText = "Error: Check your API Key."; }
        loader.style.display = "none";
    }

    // 4. Action: Image Scan
    async function analyzePlant() {
        const file = document.getElementById('imageInput').files[0];
        const out = document.getElementById('scanResult');
        const loader = document.getElementById('scanLoader');
        if (!file) return alert("Select an image first!");

        loader.style.display = "block";
        out.innerText = "";

        const reader = new FileReader();
        reader.onload = async () => {
            const base64 = reader.result.split(",")[1];
            const prompt = `Analyze this crop image like an expert scientist:
                            1. Identify the disease or pest infestation.
                            2. Provide organic cure and specific chemical pesticides.
                            3. Give preventive steps for the farmer.
                            STRICT RULE: Give the full detailed answer in ENGLISH followed by the full detailed answer in HINDI.`;
            
            try {
                const result = await askGemini(prompt, base64);
                out.innerText = result;
            } catch (e) { out.innerText = "Error analyzing image."; }
            loader.style.display = "none";
        };
        reader.readAsDataURL(file);
    }

    initWeather();
</script>

</body>
</html>
